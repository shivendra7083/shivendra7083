name: Update Profile Stats

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=${{ github.repository_owner }}&theme=flat&no-frame=true&margin-w=6&margin-h=6&column=6&row=2
          path: assets/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate profile statistics cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const token = process.env.GITHUB_TOKEN;
          const login = process.env.GH_USER;

          const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const fmt = (n) => Number(n).toLocaleString('en-US');
          const svg = (body, width=760, height=210) => `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><rect width="100%" height="100%" rx="14" fill="#0d1117"/><rect x="1" y="1" width="${width-2}" height="${height-2}" rx="13" fill="none" stroke="#30363d"/>${body}</svg>`;

          async function gql(query, variables={}) {
            const r = await fetch('https://api.github.com/graphql', {
              method:'POST',
              headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json','User-Agent':'profile-stats-action'},
              body:JSON.stringify({query,variables})
            });
            const j = await r.json();
            if (!r.ok || j.errors) throw new Error(JSON.stringify(j.errors || j));
            return j.data;
          }

          async function rest(path) {
            const r = await fetch(`https://api.github.com${path}`, {
              headers:{'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github+json','User-Agent':'profile-stats-action'}
            });
            if (!r.ok) throw new Error(`${r.status} ${path}`);
            return r.json();
          }

          async function allRepos() {
            const repos=[];
            for (let page=1; page<=10; page++) {
              const batch = await rest(`/users/${login}/repos?per_page=100&page=${page}&type=owner`);
              repos.push(...batch);
              if (batch.length < 100) break;
            }
            return repos;
          }

          function yearRange(y) {
            const from = `${y}-01-01T00:00:00Z`;
            const to = y === new Date().getUTCFullYear() ? new Date().toISOString() : `${y+1}-01-01T00:00:00Z`;
            return {from,to};
          }

          function streakInfo(calendar) {
            const days = calendar.flatMap(w=>w.contributionDays).sort((a,b)=>a.date.localeCompare(b.date));
            let longest=0,current=0,run=0;
            for (const d of days) {
              if (d.contributionCount>0) { run++; longest=Math.max(longest,run); }
              else run=0;
            }
            for (let i=days.length-1;i>=0;i--) {
              if (days[i].contributionCount>0) current++;
              else break;
            }
            return {longest,current,total:days.reduce((s,d)=>s+d.contributionCount,0)};
          }

          function contributionColor(count,max) {
            if(!count) return '#161b22';
            const ratio=count/Math.max(1,max);
            if(ratio<0.15) return '#0e4429';
            if(ratio<0.35) return '#006d32';
            if(ratio<0.6) return '#26a641';
            return '#39d353';
          }

          (async()=>{
            const user = await gql(`query($login:String!){user(login:$login){name followers{totalCount} repositories(ownerAffiliations:OWNER,privacy:PUBLIC,first:1){totalCount} createdAt}}`,{login});
            const u=user.user;
            const repos=await allRepos();
            const stars=repos.reduce((s,r)=>s+r.stargazers_count,0);
            const currentYear=new Date().getUTCFullYear();
            const startYear=Math.max(2014, new Date(u.createdAt).getUTCFullYear());
            let lifetimeCommits=0,lifetimePRs=0,lifetimeIssues=0,lifetimeReviews=0;
            let currentCalendar=[];

            for(let y=startYear;y<=currentYear;y++){
              const {from,to}=yearRange(y);
              const d=await gql(`query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){totalCommitContributions,totalPullRequestContributions,totalIssueContributions,totalPullRequestReviewContributions,contributionCalendar{weeks{contributionDays{date,contributionCount}}}}}}`,{login,from,to});
              const c=d.user.contributionsCollection;
              lifetimeCommits+=c.totalCommitContributions;
              lifetimePRs+=c.totalPullRequestContributions;
              lifetimeIssues+=c.totalIssueContributions;
              lifetimeReviews+=c.totalPullRequestReviewContributions;
              if(y===currentYear) currentCalendar=c.contributionCalendar.weeks;
            }

            const streak=streakInfo(currentCalendar);

            const languageBytes={};
            for(const r of repos.slice(0,100)){
              try{
                const langs=await rest(`/repos/${login}/${encodeURIComponent(r.name)}/languages`);
                for(const [lang,bytes] of Object.entries(langs)) languageBytes[lang]=(languageBytes[lang]||0)+bytes;
              }catch{}
            }
            const top=Object.entries(languageBytes).sort((a,b)=>b[1]-a[1]).slice(0,6);
            const maxLang=top[0]?.[1]||1;

            const statsBody=`
              <text x="28" y="35" fill="#58a6ff" font-family="Arial,sans-serif" font-size="19" font-weight="700">GitHub Statistics</text>
              <text x="28" y="58" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">${esc(login)} • refreshed daily</text>
              <g font-family="Arial,sans-serif">
                <text x="28" y="96" fill="#8b949e" font-size="11">Repositories</text><text x="28" y="122" fill="#f0f6fc" font-size="22" font-weight="700">${fmt(u.repositories.totalCount)}</text>
                <text x="150" y="96" fill="#8b949e" font-size="11">Followers</text><text x="150" y="122" fill="#f0f6fc" font-size="22" font-weight="700">${fmt(u.followers.totalCount)}</text>
                <text x="255" y="96" fill="#8b949e" font-size="11">Stars</text><text x="255" y="122" fill="#f0f6fc" font-size="22" font-weight="700">${fmt(stars)}</text>
                <text x="345" y="96" fill="#8b949e" font-size="11">Commits</text><text x="345" y="122" fill="#f0f6fc" font-size="22" font-weight="700">${fmt(lifetimeCommits)}</text>
                <text x="455" y="96" fill="#8b949e" font-size="11">PRs</text><text x="455" y="122" fill="#f0f6fc" font-size="22" font-weight="700">${fmt(lifetimePRs)}</text>
                <text x="550" y="96" fill="#8b949e" font-size="11">Issues</text><text x="550" y="122" fill="#f0f6fc" font-size="22" font-weight="700">${fmt(lifetimeIssues)}</text>
              </g>
              <line x1="28" y1="145" x2="732" y2="145" stroke="#30363d"/>
              <text x="28" y="174" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">Pull Request Reviews</text><text x="28" y="196" fill="#58a6ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">${fmt(lifetimeReviews)}</text>
              <text x="210" y="174" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">Current year contributions</text><text x="210" y="196" fill="#58a6ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">${fmt(streak.total)}</text>`;

            const streakBody=`
              <text x="28" y="35" fill="#ff7b72" font-family="Arial,sans-serif" font-size="19" font-weight="700">GitHub Contribution Streak</text>
              <text x="28" y="58" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Live contribution data from GitHub</text>
              <g font-family="Arial,sans-serif">
                <text x="60" y="104" fill="#8b949e" font-size="11">Total Contributions</text><text x="60" y="137" fill="#f0f6fc" font-size="30" font-weight="700">${fmt(streak.total)}</text>
                <text x="305" y="104" fill="#8b949e" font-size="11">Current Streak</text><text x="305" y="137" fill="#ff7b72" font-size="30" font-weight="700">${fmt(streak.current)}</text><text x="380" y="137" fill="#8b949e" font-size="12">days</text>
                <text x="530" y="104" fill="#8b949e" font-size="11">Longest Streak</text><text x="530" y="137" fill="#ff7b72" font-size="30" font-weight="700">${fmt(streak.longest)}</text><text x="605" y="137" fill="#8b949e" font-size="12">days</text>
              </g>
              <line x1="60" y1="160" x2="700" y2="160" stroke="#30363d"/>
              <text x="60" y="184" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">Calculated directly from GitHub's contribution graph.</text>`;

            let y=66;
            const langParts=top.map(([name,bytes],i)=>{
              const pct=(bytes/maxLang*100).toFixed(1);
              const bar=Math.max(55,Math.round(bytes/maxLang*320));
              const colors=['#58a6ff','#f78166','#3fb950','#d29922','#bc8cff','#79c0ff'];
              const color=colors[i%colors.length];
              const out=`<text x="28" y="${y}" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="13">${esc(name)}</text><text x="385" y="${y}" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">${pct}%</text><rect x="28" y="${y+10}" width="330" height="8" rx="4" fill="#21262d"/><rect x="28" y="${y+10}" width="${bar}" height="8" rx="4" fill="${color}"/>`;
              y+=42; return out;
            }).join('');
            const langsBody=`<text x="28" y="35" fill="#58a6ff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Top Languages</text>${langParts || '<text x="28" y="80" fill="#8b949e" font-family="Arial,sans-serif" font-size="13">No language data available yet.</text>'}`;

            const allDays=currentCalendar.flatMap(w=>w.contributionDays).sort((a,b)=>a.date.localeCompare(b.date));
            const maxContribution=Math.max(1,...allDays.map(d=>d.contributionCount));
            let graph='';
            const cell=10,gap=3,left=28,topY=55;
            allDays.forEach((d,i)=>{
              const week=Math.floor(i/7),day=i%7;
              const x=left+week*(cell+gap), y=topY+day*(cell+gap);
              graph += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2" fill="${contributionColor(d.contributionCount,maxContribution)}"/>`;
            });
            const activityBody=`<text x="28" y="31" fill="#58a6ff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Contribution Activity</text><text x="28" y="48" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">${currentYear} • darker cells indicate more activity</text>${graph}`;

            fs.mkdirSync('assets',{recursive:true});
            fs.writeFileSync('assets/github-stats.svg',svg(statsBody,760,220));
            fs.writeFileSync('assets/github-streak.svg',svg(streakBody,760,210));
            fs.writeFileSync('assets/top-languages.svg',svg(langsBody,500,320));
            fs.writeFileSync('assets/contribution-activity.svg',svg(activityBody,760,150));
          })().catch(err=>{ console.error(err); process.exit(1); });
          NODE

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || (git commit -m "Update profile statistics" && git push)
