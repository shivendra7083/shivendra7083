name: Update GitHub Profile Cards

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=${{ github.repository_owner }}&theme=flat&no-frame=true&margin-w=6&margin-h=6&column=6&row=2
          path: assets/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate statistics, streak and contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const token = process.env.GITHUB_TOKEN;
          const login = process.env.GH_USER;
          const year = new Date().getUTCFullYear();

          const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');
          const fmt = n => Number(n).toLocaleString('en-US');
          const card = (body,w,h) => `<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" rx="14" fill="#0d1117"/><rect x="1" y="1" width="${w-2}" height="${h-2}" rx="13" fill="none" stroke="#30363d"/>${body}</svg>`;

          async function gql(query, variables={}) {
            const r = await fetch('https://api.github.com/graphql', {
              method:'POST',
              headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json','User-Agent':'github-profile-cards'},
              body:JSON.stringify({query,variables})
            });
            const j = await r.json();
            if(!r.ok || j.errors) throw new Error(JSON.stringify(j.errors||j));
            return j.data;
          }

          async function rest(path) {
            const r = await fetch(`https://api.github.com${path}`, {
              headers:{Authorization:`Bearer ${token}`,'Accept':'application/vnd.github+json','User-Agent':'github-profile-cards'}
            });
            if(!r.ok) throw new Error(`${r.status} ${path}`);
            return r.json();
          }

          async function repos() {
            const all=[];
            for(let p=1;p<=10;p++){
              const b=await rest(`/users/${login}/repos?per_page=100&page=${p}&type=owner`);
              all.push(...b);
              if(b.length<100) break;
            }
            return all;
          }

          const range = y => ({from:`${y}-01-01T00:00:00Z`,to:y===year?new Date().toISOString():`${y+1}-01-01T00:00:00Z`});
          const streakInfo = days => {
            let longest=0,run=0,current=0,active=0;
            for(const d of days){ if(d.contributionCount>0){run++;active++;longest=Math.max(longest,run);}else run=0; }
            for(let i=days.length-1;i>=0;i--){ if(days[i].contributionCount>0) current++; else break; }
            return {total:days.reduce((s,d)=>s+d.contributionCount,0),longest,current,active};
          };
          const color = (n,max) => !n?'#161b22':(n/max<.15?'#0e4429':n/max<.35?'#006d32':n/max<.6?'#26a641':'#39d353');

          (async()=>{
            const u=(await gql(`query($login:String!){user(login:$login){createdAt followers{totalCount} repositories(ownerAffiliations:OWNER,privacy:PUBLIC,first:1){totalCount}}}`,{login})).user;
            const rs=await repos();
            const stars=rs.reduce((s,r)=>s+r.stargazers_count,0);
            const start=Math.max(2014,new Date(u.createdAt).getUTCFullYear());
            let commits=0,prs=0,issues=0,reviews=0,weeks=[];
            for(let y=start;y<=year;y++){
              const {from,to}=range(y);
              const c=(await gql(`query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){totalCommitContributions,totalPullRequestContributions,totalIssueContributions,totalPullRequestReviewContributions,contributionCalendar{weeks{contributionDays{date,contributionCount}}}}}}`,{login,from,to})).user.contributionsCollection;
              commits+=c.totalCommitContributions; prs+=c.totalPullRequestContributions; issues+=c.totalIssueContributions; reviews+=c.totalPullRequestReviewContributions;
              if(y===year) weeks=c.contributionCalendar.weeks;
            }
            const days=weeks.flatMap(w=>w.contributionDays).sort((a,b)=>a.date.localeCompare(b.date));
            const streak=streakInfo(days), max=Math.max(1,...days.map(d=>d.contributionCount));
            const lang={};
            for(const r of rs.slice(0,100)){ try{ const l=await rest(`/repos/${login}/${encodeURIComponent(r.name)}/languages`); for(const [k,v] of Object.entries(l)) lang[k]=(lang[k]||0)+v; }catch{} }
            const top=Object.entries(lang).sort((a,b)=>b[1]-a[1]).slice(0,6), maxLang=top[0]?.[1]||1;

            const stats=`
              <text x="28" y="34" fill="#58a6ff" font-family="Arial" font-size="19" font-weight="700">GitHub Statistics</text>
              <text x="28" y="56" fill="#8b949e" font-family="Arial" font-size="12">${esc(login)} • refreshed daily</text>
              <g font-family="Arial">
              <text x="28" y="96" fill="#8b949e" font-size="11">Repositories</text><text x="28" y="122" fill="#f0f6fc" font-size="22" font-weight="700">${fmt(u.repositories.totalCount)}</text>
              <text x="150" y="96" fill="#8b949e" font-size="11">Followers</text><text x="150" y="122" fill="#f0f6fc" font-size="22" font-weight="700">${fmt(u.followers.totalCount)}</text>
              <text x="255" y="96" fill="#8b949e" font-size="11">Stars</text><text x="255" y="122" fill="#f0f6fc" font-size="22" font-weight="700">${fmt(stars)}</text>
              <text x="345" y="96" fill="#8b949e" font-size="11">Commits</text><text x="345" y="122" fill="#f0f6fc" font-size="22" font-weight="700">${fmt(commits)}</text>
              <text x="455" y="96" fill="#8b949e" font-size="11">PRs</text><text x="455" y="122" fill="#f0f6fc" font-size="22" font-weight="700">${fmt(prs)}</text>
              <text x="550" y="96" fill="#8b949e" font-size="11">Issues</text><text x="550" y="122" fill="#f0f6fc" font-size="22" font-weight="700">${fmt(issues)}</text>
              </g><line x1="28" y1="145" x2="732" y2="145" stroke="#30363d"/>
              <text x="28" y="174" fill="#8b949e" font-family="Arial" font-size="11">PR Reviews</text><text x="28" y="196" fill="#58a6ff" font-family="Arial" font-size="18" font-weight="700">${fmt(reviews)}</text>
              <text x="210" y="174" fill="#8b949e" font-family="Arial" font-size="11">${year} Contributions</text><text x="210" y="196" fill="#58a6ff" font-family="Arial" font-size="18" font-weight="700">${fmt(streak.total)}</text>`;

            const streakCard=`
              <text x="28" y="35" fill="#ff7b72" font-family="Arial" font-size="19" font-weight="700">GitHub Contribution Streak</text>
              <text x="28" y="57" fill="#8b949e" font-family="Arial" font-size="12">Calculated from your GitHub contribution calendar</text>
              <text x="55" y="104" fill="#8b949e" font-family="Arial" font-size="11">Total Commits</text><text x="55" y="137" fill="#f0f6fc" font-family="Arial" font-size="30" font-weight="700">${fmt(commits)}</text>
              <text x="300" y="104" fill="#8b949e" font-family="Arial" font-size="11">Current Streak</text><text x="300" y="137" fill="#ff7b72" font-family="Arial" font-size="30" font-weight="700">${fmt(streak.current)}</text><text x="375" y="137" fill="#8b949e" font-family="Arial" font-size="12">days</text>
              <text x="525" y="104" fill="#8b949e" font-family="Arial" font-size="11">Longest Streak</text><text x="525" y="137" fill="#ff7b72" font-family="Arial" font-size="30" font-weight="700">${fmt(streak.longest)}</text><text x="600" y="137" fill="#8b949e" font-family="Arial" font-size="12">days</text>
              <line x1="55" y1="160" x2="700" y2="160" stroke="#30363d"/><text x="55" y="182" fill="#8b949e" font-family="Arial" font-size="11">Active days in ${year}: ${fmt(streak.active)}</text>`;

            let ly=70;
            const langBars=top.map(([name,bytes],i)=>{
              const pct=(bytes/maxLang*100).toFixed(1), w=Math.max(55,Math.round(bytes/maxLang*330));
              const c=['#58a6ff','#f78166','#3fb950','#d29922','#bc8cff','#79c0ff'][i%6];
              const out=`<text x="28" y="${ly}" fill="#f0f6fc" font-family="Arial" font-size="13">${esc(name)}</text><text x="385" y="${ly}" fill="#8b949e" font-family="Arial" font-size="12">${pct}%</text><rect x="28" y="${ly+10}" width="330" height="8" rx="4" fill="#21262d"/><rect x="28" y="${ly+10}" width="${w}" height="8" rx="4" fill="${c}"/>`;
              ly+=42; return out;
            }).join('');
            const languages=`<text x="28" y="35" fill="#58a6ff" font-family="Arial" font-size="19" font-weight="700">Top Languages</text><text x="28" y="55" fill="#8b949e" font-family="Arial" font-size="11">Repository language breakdown</text>${langBars}`;

            const jan1=new Date(Date.UTC(year,0,1));
            const dec31=new Date(Date.UTC(year,11,31));
            const gridStart=new Date(jan1); gridStart.setUTCDate(gridStart.getUTCDate()-gridStart.getUTCDay());
            const weeks=Math.ceil((dec31-gridStart)/(7*86400000))+1;
            const cell=11,gap=3,left=52,topY=48;
            const w=Math.max(760,left+weeks*(cell+gap)+22),h=250;
            const dayMap=new Map(days.map(d=>[d.date,d.contributionCount]));
            let cells='',months='',weekdays='';
            let lastMonth=-1;
            for(let week=0;week<weeks;week++){
              const base=new Date(gridStart); base.setUTCDate(base.getUTCDate()+week*7);
              if(base.getUTCMonth()!==lastMonth){
                months+=`<text x="${left+week*(cell+gap)}" y="32" fill="#8b949e" font-family="Arial" font-size="10">${base.toLocaleString('en-US',{month:'short',timeZone:'UTC'})}</text>`;
                lastMonth=base.getUTCMonth();
              }
              for(let day=0;day<7;day++){
                const d=new Date(base); d.setUTCDate(d.getUTCDate()+day);
                if(d<jan1||d>dec31) continue;
                const key=d.toISOString().slice(0,10),count=dayMap.get(key)||0;
                cells+=`<rect x="${left+week*(cell+gap)}" y="${topY+day*(cell+gap)}" width="${cell}" height="${cell}" rx="2" fill="${color(count,max)}"/>`;
              }
            }
            [['Mon',1],['Wed',3],['Fri',5]].forEach(([label,day])=>weekdays+=`<text x="12" y="${topY+day*(cell+gap)+9}" fill="#8b949e" font-family="Arial" font-size="10">${label}</text>`);
            const legendY=h-18;
            const legend=`<text x="${left}" y="${legendY}" fill="#8b949e" font-family="Arial" font-size="10">Less</text><rect x="${left+32}" y="${legendY-9}" width="10" height="10" rx="2" fill="#161b22"/><rect x="${left+48}" y="${legendY-9}" width="10" height="10" rx="2" fill="#0e4429"/><rect x="${left+64}" y="${legendY-9}" width="10" height="10" rx="2" fill="#006d32"/><rect x="${left+80}" y="${legendY-9}" width="10" height="10" rx="2" fill="#26a641"/><rect x="${left+96}" y="${legendY-9}" width="10" height="10" rx="2" fill="#39d353"/><text x="${left+113}" y="${legendY}" fill="#8b949e" font-family="Arial" font-size="10">More</text>`;
            const activity=`<text x="18" y="21" fill="#58a6ff" font-family="Arial" font-size="18" font-weight="700">Contribution Activity</text><text x="${w-260}" y="21" fill="#8b949e" font-family="Arial" font-size="10">${year} • ${fmt(streak.total)} contributions • ${fmt(streak.active)} active days</text>${months}${weekdays}${cells}<text x="18" y="${legendY}" fill="#8b949e" font-family="Arial" font-size="10">Daily activity</text>${legend}`;

            fs.mkdirSync('assets',{recursive:true});
            fs.writeFileSync('assets/github-stats.svg',card(stats,760,220));
            fs.writeFileSync('assets/github-streak.svg',card(streakCard,760,210));
            fs.writeFileSync('assets/top-languages.svg',card(languages,500,320));
            fs.writeFileSync('assets/contribution-activity.svg',card(activity,w,h));
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || (git commit -m "Update profile cards" && git push)
